    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Proj4js -->

<body>
    <!-- [Estructura HTML original completa se mantiene igual] -->
    
    <!-- ============================================= -->
    <!-- SCRIPT PRINCIPAL UNIFICADO Y REPARADO         -->
    <!-- ============================================= -->
    <script>
    (function() {
        'use strict';
        
        // ===== CONSTANTES DE ALMACENAMIENTO =====
        const STORAGE_KEY = 'militopo_v3';
        const ORI_STORAGE_KEY = 'militopo_orientacion_v3';
        const SAFE_POINTS_KEY = 'militopo_special_points_v3';
        const THEME_KEY = 'militopo_tema';
        
        // ===== ESTADO GLOBAL ÚNICO =====
        const AppState = {
            // Modo topográfico
            modulos: 8,
            puntosPorModulo: 5,
            puntosData: {},
            coordType: 'UTM',
            currentStep: 1,
            
            // Modo orientación
            orientacion: {
                exerciseName: '',
                count: 4,
                totalPool: 20,
                balizasPorRecorrido: 5,
                participants: [],
                poolPoints: [],
                generatedRoutes: [],
                materialReady: false,
                scanLog: [],
                startQueueIndex: 0,
                resultsExported: false,
                mapLayer: 'mapant',
                currentStep: 1
            },
            
            // Puntos especiales
            specialPoints: {
                salida: { utm: '', desc: 'Salida común' },
                llegada: { utm: '', desc: 'Llegada común' }
            },
            
            // Modo de aplicación
            appMode: 'topografica',
            hasUnsavedChanges: false,
            theme: 'light'
        };
        
        // ===== REFERENCIAS AL DOM =====
        let map = null;
        let oxMap = null;
        let oxLayers = {};
        let oxMarkers = {};
        let oxSpecialMarkers = {};
        let oxUserMarker = null;
        let oxSelectedPointId = null;
        let oxDraggingSpecialKey = null;
        
        // ===== FUNCIONES DE UTILIDAD =====
        function $(id) { return document.getElementById(id); }
        
        function saveState() {
            try {
                const data = {
                    modulos: AppState.modulos,
                    puntosPorModulo: AppState.puntosPorModulo,
                    puntosData: AppState.puntosData,
                    coordType: AppState.coordType,
                    orientacion: AppState.orientacion,
                    specialPoints: AppState.specialPoints,
                    appMode: AppState.appMode
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                AppState.hasUnsavedChanges = false;
            } catch(e) {
                console.error('Error al guardar estado:', e);
            }
        }
        
        function loadState() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const data = JSON.parse(saved);
                    Object.assign(AppState, data);
                    if (data.orientacion) Object.assign(AppState.orientacion, data.orientacion);
                    if (data.specialPoints) Object.assign(AppState.specialPoints, data.specialPoints);
                }
            } catch(e) {
                console.error('Error al cargar estado:', e);
            }
            
            // Inicializar si no hay datos
            if (Object.keys(AppState.puntosData).length === 0) {
                AppState.puntosData = generarEstructuraCompleta();
            }
        }
        
        function markUnsavedChanges() {
            AppState.hasUnsavedChanges = true;
        }
        
        function clearUnsavedChanges() {
            AppState.hasUnsavedChanges = false;
        }
        
        // ===== FUNCIONES DE COORDENADAS =====
        function getPuntoId(m, p) { return `P${m}${p}`; }
        
        function esUTMValido(coord) {
            if (!coord || typeof coord !== 'string') return false;
            const partes = coord.trim().split(/\s+/);
            return partes.length === 3 && 
                   /^[0-9]{1,2}[A-Z]$/i.test(partes[0]) &&
                   /^[0-9]{6}$/.test(partes[1]) &&
                   /^[0-9]{7}$/.test(partes[2]);
        }
        
        function esMGRSValido(coord) {
            if (!coord || typeof coord !== 'string') return false;
            const partes = coord.trim().split(/\s+/);
            return partes.length === 4 &&
                   /^[0-9]{1,2}[A-Z]$/i.test(partes[0]) &&
                   /^[A-Z]{2}$/i.test(partes[1]) &&
                   /^[0-9]{5}$/.test(partes[2]) &&
                   /^[0-9]{5}$/.test(partes[3]);
        }
        
        function esCoordenadaValida(coord, tipo) {
            if (!coord || coord.trim() === "") return false;
            return tipo === "UTM" ? esUTMValido(coord) : esMGRSValido(coord);
        }
        
        function latLonToUTM(lat, lon) {
            try {
                const utmZone = Math.floor((lon + 180) / 6) + 1;
                const projUTM = `+proj=utm +zone=${utmZone} +ellps=WGS84 +datum=WGS84 +units=m +no_defs`;
                const wgs84 = "+proj=longlat +datum=WGS84 +no_defs";
                const coord = proj4(wgs84, projUTM, [lon, lat]);
                let este = Math.round(coord[0]);
                let norte = Math.round(coord[1]);
                
                const bandas = "CDEFGHJKLMNPQRSTUVWX";
                let indice = Math.floor((lat + 80) / 8);
                indice = Math.max(0, Math.min(bandas.length - 1, indice));
                let letraBanda = bandas[indice];
                
                return `${utmZone}${letraBanda} ${este} ${norte}`;
            } catch(e) {
                return null;
            }
        }
        
        function latLonToMGRS(lat, lon) {
            try {
                const utmZone = Math.floor((lon + 180) / 6) + 1;
                const projUTM = `+proj=utm +zone=${utmZone} +ellps=WGS84 +datum=WGS84 +units=m +no_defs`;
                const wgs84 = "+proj=longlat +datum=WGS84 +no_defs";
                let coord = proj4(wgs84, projUTM, [lon, lat]);
                let este = coord[0];
                let norte = coord[1];
                
                const bandas = "CDEFGHJKLMNPQRSTUVWX";
                let indice = Math.floor((lat + 80) / 8);
                indice = Math.max(0, Math.min(bandas.length - 1, indice));
                let letraBanda = bandas[indice];
                
                const letras = "ABCDEFGHJKLMNPQRSTUV";
                let columna = Math.floor(este / 100000) % 20;
                let fila = lat >= 0 ? Math.floor(norte / 100000) % 20 : 19 - (Math.floor(norte / 100000) % 20);
                
                let cuadrante = letras[columna] + letras[fila];
                let esteResto = Math.floor(este % 100000);
                let norteResto = Math.floor(norte % 100000);
                
                return `${utmZone}${letraBanda} ${cuadrante} ${String(esteResto).padStart(5, '0')} ${String(norteResto).padStart(5, '0')}`;
            } catch(e) {
                return null;
            }
        }
        
        function latLonToCoordText(lat, lng) {
            return AppState.coordType === "UTM" ? latLonToUTM(lat, lng) : latLonToMGRS(lat, lng);
        }
        
        function utmToLatLon(utmStr) {
            try {
                let partes = utmStr.trim().split(/\s+/);
                if (partes.length < 3) return null;
                let zonaLetra = partes[0];
                let este = parseFloat(partes[1]);
                let norte = parseFloat(partes[2]);
                let zonaNum = parseInt(zonaLetra.match(/\d+/)[0]);
                let letra = zonaLetra.match(/[A-Z]/)[0];
                const letrasNorte = "NPQRSTUVWX";
                const isNorth = letrasNorte.includes(letra);
                const projUTM = `+proj=utm +zone=${zonaNum} +${isNorth ? 'north' : 'south'} +ellps=WGS84 +datum=WGS84 +units=m +no_defs`;
                const wgs84 = "+proj=longlat +datum=WGS84 +no_defs";
                let [lon, lat] = proj4(projUTM, wgs84, [este, norte]);
                return { lat, lon };
            } catch(e) {
                return null;
            }
        }
        
        // ===== FUNCIONES TOPOGRÁFICAS =====
        function generarEstructuraCompleta() {
            let nuevos = {};
            for (let m = 1; m <= AppState.modulos; m++) {
                for (let p = 1; p <= AppState.puntosPorModulo; p++) {
                    let este = 450000 + m * 820 + p * 140;
                    let norte = 4780000 + m * 550 - p * 90;
                    nuevos[getPuntoId(m, p)] = {
                        coordsUTM: `30T ${este} ${norte}`,
                        descripcion: `${["COTA","COLLADO","ÁRBOL","FUENTE","LOMA"][(p-1)%5]} ${getPuntoId(m,p)}`
                    };
                }
            }
            return nuevos;
        }
        
        function verificarCompletos() {
            let faltantes = [];
            for (let m = 1; m <= AppState.modulos; m++) {
                for (let p = 1; p <= AppState.puntosPorModulo; p++) {
                    let id = getPuntoId(m, p);
                    let d = AppState.puntosData[id];
                    if (!d || !d.coordsUTM || !esCoordenadaValida(d.coordsUTM, AppState.coordType) ||
                        !d.descripcion || d.descripcion.trim() === "") {
                        faltantes.push(id);
                    }
                }
            }
            return { ok: faltantes.length === 0, faltantes };
        }
        
        function toast(msg, tipo) {
            let t = document.createElement("div");
            t.className = "toast";
            t.style.background = tipo === "success" ? "var(--success)" : "var(--error)";
            t.innerHTML = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2500);
        }
        
        // ===== FUNCIONES DE ORIENTACIÓN UNIFICADAS =====
        function getPoolRoute() {
            return Array.from({length: AppState.orientacion.totalPool}, (_, i) => 
                `B${String(i + 1).padStart(2, '0')}`
            );
        }
        
        function ensurePoolPoints() {
            const ids = getPoolRoute();
            const prev = new Map(AppState.orientacion.poolPoints.map(p => [p.id, p]));
            AppState.orientacion.poolPoints = ids.map((id, idx) => {
                const old = prev.get(id) || {};
                return {
                    id,
                    utm: old.utm || '',
                    desc: old.desc || `Baliza ${idx + 1}`
                };
            });
            saveState();
        }
        
        function getPoint(id) {
            if (id === 'SALIDA') return { id: 'SALIDA', utm: AppState.specialPoints.salida.utm, desc: AppState.specialPoints.salida.desc };
            if (id === 'LLEGADA') return { id: 'LLEGADA', utm: AppState.specialPoints.llegada.utm, desc: AppState.specialPoints.llegada.desc };
            return AppState.orientacion.poolPoints.find(p => p.id === id) || { id, utm: '', desc: '' };
        }
        
        function pointComplete(p) {
            return !!(p && esUTMValido(p.utm) && p.desc && p.desc.trim());
        }
        
        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }
        
        function estimateDistance(seq) {
            const pts = seq.map((id, idx) => {
                const p = getPoint(id);
                const m = String(p.utm || '').trim().match(/^(\d{1,2}[C-X])\s+(\d{6})\s+(\d{7})$/i);
                if (m) return { x: Number(m[2]), y: Number(m[3]) };
                return { x: (idx + 1) * 70, y: (idx % 7) * 65 };
            });
            let d = 0;
            for (let i = 1; i < pts.length; i++) {
                const dx = pts[i].x - pts[i-1].x;
                const dy = pts[i].y - pts[i-1].y;
                d += Math.sqrt(dx * dx + dy * dy);
            }
            return Math.round(d);
        }
        
        function generateOriRoutes() {
            const participants = AppState.orientacion.participants;
            const pool = AppState.orientacion.poolPoints.filter(p => pointComplete(p)).map(p => p.id);
            const perRoute = AppState.orientacion.balizasPorRecorrido;
            
            if (!participants.length || !pool.length || !perRoute) return false;
            
            const usage = {};
            pool.forEach(id => usage[id] = 0);
            
            const routes = participants.map((p, idx) => {
                const local = new Set();
                const seq = [];
                while (seq.length < perRoute) {
                    const candidates = pool
                        .filter(id => !local.has(id))
                        .sort((a, b) => (usage[a] - usage[b]) || (Math.random() - 0.5));
                    if (!candidates.length) break;
                    const pick = candidates[0];
                    seq.push(pick);
                    local.add(pick);
                    usage[pick] = (usage[pick] || 0) + 1;
                }
                return {
                    participant: p.name,
                    qrId: p.qrId,
                    sequence: ['SALIDA', ...seq, 'LLEGADA'],
                    variableSequence: seq,
                    distance: estimateDistance(['SALIDA', ...seq, 'LLEGADA']),
                    coincidencias: 0
                };
            });
            
            routes.forEach((r, i) => {
                let overlap = 0;
                routes.forEach((o, j) => {
                    if (i !== j) {
                        const set = new Set(r.variableSequence);
                        o.variableSequence.forEach(id => { if (set.has(id)) overlap++; });
                    }
                });
                r.coincidencias = overlap;
            });
            
            AppState.orientacion.generatedRoutes = routes;
            saveState();
            return true;
        }
        
        function renderOriRoutesSummary() {
            const wrap = $('oxCompactSummaryWrap');
            const routes = AppState.orientacion.generatedRoutes;
            if (!wrap || !routes.length) return;
            
            const distances = routes.map(r => Number(r.distance) || 0).filter(v => v > 0);
            const avg = distances.length ? Math.round(distances.reduce((a, b) => a + b, 0) / distances.length) : 0;
            const minD = distances.length ? Math.min(...distances) : 0;
            const maxD = distances.length ? Math.max(...distances) : 0;
            const avgOverlap = routes.length ? Math.round(routes.reduce((a, r) => a + r.coincidencias, 0) / routes.length) : 0;
            
            wrap.innerHTML = `
                <div class="ox-tech-card">
                    <div class="ox-tech-title">📋 RESUMEN TÉCNICO PREVIO</div>
                    <div class="ox-tech-grid">
                        <div class="ox-tech-item"><div class="ox-tech-k">RECORRIDOS</div><div class="ox-tech-v big">${routes.length}</div></div>
                        <div class="ox-tech-item"><div class="ox-tech-k">DISTANCIA MEDIA</div><div class="ox-tech-v big">${(avg/1000).toFixed(3)} km</div></div>
                        <div class="ox-tech-item"><div class="ox-tech-k">MÁS CORTO / LARGO</div><div class="ox-tech-v big">${(minD/1000).toFixed(3)} / ${(maxD/1000).toFixed(3)}</div></div>
                        <div class="ox-tech-item"><div class="ox-tech-k">COINCIDENCIA MEDIA</div><div class="ox-tech-v big">${avgOverlap}</div></div>
                    </div>
                </div>`;
            wrap.classList.remove('step3-hidden');
            wrap.style.display = '';
        }
        
        function renderOriRoutesCards() {
            const box = $('oxRoutes');
            const routes = AppState.orientacion.generatedRoutes;
            if (!box || !routes.length) return;
            
            box.innerHTML = '';
            routes.forEach((r, idx) => {
                const card = document.createElement('div');
                card.className = 'ox-route-card';
                card.innerHTML = `
                    <div class="ox-route-head">
                        <div class="ox-route-title">${idx + 1}. ${r.participant}</div>
                        <span class="ox-badge">${r.qrId}</span>
                    </div>
                    <div class="ox-mini-grid">
                        <div class="ox-mini"><div class="k">Balizas variables</div><div class="v">${r.variableSequence.length}</div></div>
                        <div class="ox-mini"><div class="k">Distancia est.</div><div class="v">${r.distance} m</div></div>
                        <div class="ox-mini"><div class="k">Coincidencias</div><div class="v">${r.coincidencias}</div></div>
                    </div>
                    <div class="ox-route-seq">${r.sequence.map((id, si) => {
                        const label = id === 'SALIDA' ? '△ SALIDA' : (id === 'LLEGADA' ? '◎ LLEGADA' : `${si}. ${id}`);
                        return `<div class="ox-chip">${label}</div>`;
                    }).join('')}</div>`;
                box.appendChild(card);
            });
            box.classList.remove('step3-hidden');
            box.style.display = '';
        }
        
        function refreshOriOutputs() {
            const helper = $('oxStep3Helper');
            const wrap = $('oxCompactSummaryWrap');
            const box = $('oxRoutes');
            const routes = AppState.orientacion.generatedRoutes;
            
            if (!routes.length) {
                if (helper) helper.style.display = '';
                if (wrap) { wrap.classList.add('step3-hidden'); wrap.style.display = 'none'; }
                if (box) { box.classList.add('step3-hidden'); box.style.display = 'none'; }
                return;
            }
            
            if (helper) helper.style.display = 'none';
            renderOriRoutesSummary();
            renderOriRoutesCards();
        }
        
        // ===== RENDERIZACIÓN DE INTERFAZ DE ORIENTACIÓN =====
        let oriStepToastReady = false;
        
        function oriSetStep(step) {
            const prev = AppState.orientacion.currentStep;
            AppState.orientacion.currentStep = step;
            saveState();
            
            document.querySelectorAll('#orientacionShell .ox-page').forEach((p, idx) => {
                p.style.display = (idx + 1 === step ? 'block' : 'none');
            });
            
            document.querySelectorAll('#orientacionShell .ox-step').forEach(el => {
                const s = Number(el.dataset.step);
                el.classList.toggle('active', s === step);
                el.classList.toggle('done', s < step);
            });
            
            if (oriStepToastReady && prev !== step) {
                const msgs = {
                    1: 'Paso 1 · Configura participantes y bolsa de balizas.',
                    2: 'Paso 2 · Edita las balizas en el mapa.',
                    3: 'Paso 3 · Genera recorridos automáticos equilibrados.',
                    4: 'Paso 4 · Prepara el material real del ejercicio.',
                    5: 'Paso 5 · Inicia la salida secuencial.',
                    6: 'Paso 6 · Tablón en vivo del ejercicio.'
                };
                toast(msgs[step] || 'Paso actualizado.', 'success');
            }
            oriStepToastReady = true;
        }
        
        function renderOriRoot() {
            const shell = $('orientacionShell');
            if (!shell) return;
            
            // Limpiar mapa anterior si existe
            if (oxMap) {
                try { oxMap.off(); oxMap.remove(); } catch(e) {}
                oxMap = null;
                oxMarkers = {};
                oxSpecialMarkers = {};
                oxUserMarker = null;
            }
            
            shell.innerHTML = generateOrientationHTML();
            bindOrientationEvents();
            
            // Inicializar datos
            ensurePoolPoints();
            fillOriInputs();
            oriSetStep(AppState.orientacion.currentStep || 1);
            
            setTimeout(() => initOriMapIfNeeded(), 200);
        }
        
        function generateOrientationHTML() {
            const pool = getPoolRoute();
            return `
            <div class="ox-wrap">
                <div class="ox-steps">
                    <div class="ox-step active" data-step="1">PASO 1 · BASE</div>
                    <div class="ox-step" data-step="2">PASO 2 · EDITAR BALIZAS</div>
                    <div class="ox-step" data-step="3">PASO 3 · RECORRIDOS</div>
                    <div class="ox-step" data-step="4">PASO 4 · MATERIAL</div>
                    <div class="ox-step" data-step="5">PASO 5 · INICIO</div>
                    <div class="ox-step" data-step="6">PASO 6 · TABLÓN</div>
                </div>

                <!-- PASO 1 -->
                <div id="oxStep1" class="ox-page active">
                    <div class="card">
                        <div class="card-header"><h2>🏁 BASE DEL EJERCICIO</h2></div>
                        <div class="config-row">
                            <div class="config-item" style="min-width:280px;">
                                <label>🎯 Nombre del ejercicio</label>
                                <input id="oxExerciseName" class="ox-modern-input" type="text" placeholder="Ej. Carrera orientación Base Alfa">
                            </div>
                            <div class="config-item"><label>👥 Nº participantes</label><select id="oxCount"></select></div>
                            <div class="config-item"><label>🎯 Puntos por recorrido</label><select id="oxBalizasPorRecorrido"></select></div>
                            <div class="config-item"><label>🚩 Balizas en la bolsa</label><select id="oxTotalPool"></select></div>
                        </div>
                        <div style="margin-top:14px">
                            <div class="card" style="margin-bottom:0;border:1px solid var(--border-light)">
                                <div class="card-header"><h2>👥 PARTICIPANTES</h2></div>
                                <div class="ox-participants-box">
                                    <label>Lista de participantes</label>
                                    <div id="oxParticipantList" class="ox-participant-list"></div>
                                </div>
                            </div>
                        </div>
                        <div class="ox-savebar"><span>Guardado automático</span><span class="ox-badge">Activo</span></div>
                        <div class="nav-buttons">
                            <div></div>
                            <button id="oxToStep2" class="btn btn-primary" type="button">EDITAR BALIZAS →</button>
                        </div>
                    </div>
                </div>

                <!-- PASO 2 -->
                <div id="oxStep2" class="ox-page" style="display:none">
                    <div class="card" style="margin-bottom:0;border:1px solid var(--border-light);padding:6px 4px">
                        <div class="card-header" style="margin-bottom:4px"><h2>🗺️ MAPA DE ASIGNACIÓN</h2></div>
                        <div class="ox-map-wrap">
                            <div class="ox-map-toolbar ox-map-toolbar-topo" style="margin-bottom:4px">
                                <div class="ox-toolbar-search-row">
                                    <input id="oxPlaceSearch" type="text" placeholder="Buscar lugar, dirección o referencia" class="ox-place-search ox-place-search-topo">
                                    <button id="oxPlaceSearchBtn" class="ox-search-btn ox-search-btn-topo" type="button">🔎 Buscar</button>
                                </div>
                                <div class="ox-layer-tabs ox-layer-tabs-topo">
                                    <button class="ox-layer-btn" type="button" data-layer="topo">🗺️ IGN</button>
                                    <button class="ox-layer-btn" type="button" data-layer="aerea">🛰️ Aérea</button>

        // ===== BINDING DE EVENTOS DE ORIENTACIÓN =====
        function fillOriInputs() {
            // Selectores de paso 1
            $('oxCount').innerHTML = Array.from({length: 100}, (_, i) => i + 1)
                .map(n => `<option value="${n}" ${n === AppState.orientacion.count ? 'selected' : ''}>${n} participantes</option>`).join('');
            
            $('oxTotalPool').innerHTML = Array.from({length: 31}, (_, i) => i + 10)
                .map(n => `<option value="${n}" ${n === AppState.orientacion.totalPool ? 'selected' : ''}>${n} balizas</option>`).join('');
            
            const total = getPoolRoute().length;
            const allowed = Array.from({length: Math.min(20, total) - 4}, (_, i) => i + 5).filter(n => n <= total);
            if (!allowed.includes(AppState.orientacion.balizasPorRecorrido)) AppState.orientacion.balizasPorRecorrido = allowed[allowed.length - 1] || 5;
            
            $('oxBalizasPorRecorrido').innerHTML = allowed
                .map(n => `<option value="${n}" ${n === AppState.orientacion.balizasPorRecorrido ? 'selected' : ''}>${n} balizas</option>`).join('');
            
            $('oxExerciseName').value = AppState.orientacion.exerciseName || '';
            
            // Participantes
            if (AppState.orientacion.participants.length) {
                $('oxParticipantList').innerHTML = AppState.orientacion.participants.map((p, i) => `
                    <div class="ox-participant-row">
                        <div class="ox-participant-lock">${i + 1}</div>
                        <input class="ox-participant-name" data-participant-index="${i}" type="text" value="${p.name}">
                    </div>
                `).join('');
            }
            
            // Estadísticas
            updateOriStats();
            
            // Puntos pool
            renderPoolPointsList();
            updatePointSelectOptions();
            refreshSpecialPointsUI();
        }
        
        function updateOriStats() {
            const p = AppState.orientacion.participants.length;
            const b = getPoolRoute().length;
            const per = AppState.orientacion.balizasPorRecorrido;
            if ($('oxStatParticipants')) $('oxStatParticipants').textContent = p;
            if ($('oxStatBalizas')) $('oxStatBalizas').textContent = b;
            if ($('oxStatPerRoute')) $('oxStatPerRoute').textContent = per;
            if ($('oxMatParticipants')) $('oxMatParticipants').textContent = p;
            if ($('oxMatPersonal')) $('oxMatPersonal').textContent = p;
            if ($('oxMatBalizas')) $('oxMatBalizas').textContent = b;
            if ($('oxPoolBadge')) $('oxPoolBadge').textContent = `${b} balizas`;
        }
        
        function renderPoolPointsList() {
            const box = $('oxPointsList');
            if (!box) return;
            
            ensurePoolPoints();
            box.innerHTML = '';
            
            // Puntos especiales primero
            ['SALIDA', 'LLEGADA'].forEach(id => {
                const p = getPoint(id);
                const ok = pointComplete(p);
                const row = document.createElement('div');
                row.className = 'ox-point-row ox-point-row-special-merged';
                row.dataset.specialMerged = id;
                row.innerHTML = `
                    <div class="ox-point-id">${id}</div>
                    <input type="text" data-special-merged="utm" data-special-id="${id}" value="${p.utm}" placeholder="UTM (ej. 30T 450960 4780463)">
                    <input type="text" data-special-merged="desc" data-special-id="${id}" value="${p.desc}" placeholder="${id === 'SALIDA' ? 'Descripción de salida' : 'Descripción de llegada'}">
                    <div class="ox-point-status ${ok ? 'ok' : 'bad'}">${ok ? '✅ completa' : '❌ incompleta'}</div>`;
                box.appendChild(row);
            });
            
            // Balizas normales
            AppState.orientacion.poolPoints.forEach(p => {
                const ok = pointComplete(p);
                const row = document.createElement('div');
                row.className = 'ox-point-row';
                row.innerHTML = `
                    <div class="ox-point-id">${p.id}</div>
                    <input type="text" data-field="utm" data-id="${p.id}" value="${p.utm}" placeholder="UTM (ej. 30T 450960 4780463)">
                    <input type="text" data-field="desc" data-id="${p.id}" value="${p.desc}" placeholder="Descripción de la baliza">
                    <div class="ox-point-status ${ok ? 'ok' : 'bad'}">${ok ? '✅ completa' : '❌ incompleta'}</div>`;
                box.appendChild(row);
            });
        }
        
        function updatePointSelectOptions() {
            const sel = $('oxPointSelect');
            if (!sel) return;
            
            const current = sel.value;
            sel.innerHTML = '';
            
            // Puntos especiales primero
            ['SALIDA', 'LLEGADA'].forEach(id => {
                const p = getPoint(id);
                const ok = pointComplete(p);
                const opt = document.createElement('option');
                opt.value = id;
                opt.textContent = `${id} · ${p.desc || id} ${ok ? '✅' : '❌'}`;
                sel.appendChild(opt);
            });
            
            // Balizas normales
            AppState.orientacion.poolPoints.forEach(p => {
                const ok = pointComplete(p);
                const opt = document.createElement('option');
                opt.value = p.id;
                opt.textContent = `${p.id} · ${p.desc || 'Sin descripción'} ${ok ? '✅' : '❌'}`;
                sel.appendChild(opt);
            });
            
            if (current && Array.from(sel.options).some(o => o.value === current)) {
                sel.value = current;
            } else if (sel.options.length > 0) {
                sel.value = sel.options[0].value;
            }
            
            updatePointSelectStatus();
        }
        
        function updatePointSelectStatus() {
            const badge = $('oxPointSelectStatus');
            const sel = $('oxPointSelect');
            if (!badge || !sel) return;
            
            const p = getPoint(sel.value);
            const ok = pointComplete(p);
            badge.className = 'ox-select-status ' + (ok ? 'ok' : 'bad');
            badge.textContent = ok ? '✅' : '✖';
        }
        
        function refreshSpecialPointsUI() {
            const sU = $('oxSafeStartUtm');
            const sD = $('oxSafeStartDesc');
            const fU = $('oxSafeFinishUtm');
            const fD = $('oxSafeFinishDesc');
            const sSt = $('oxSafeStartStatus');
            const fSt = $('oxSafeFinishStatus');
            
            if (sU && document.activeElement !== sU) sU.value = AppState.specialPoints.salida.utm;
            if (sD && document.activeElement !== sD) sD.value = AppState.specialPoints.salida.desc;
            if (fU && document.activeElement !== fU) fU.value = AppState.specialPoints.llegada.utm;
            if (fD && document.activeElement !== fD) fD.value = AppState.specialPoints.llegada.desc;
            
            const sOk = pointComplete({ utm: AppState.specialPoints.salida.utm, desc: AppState.specialPoints.salida.desc });
            const fOk = pointComplete({ utm: AppState.specialPoints.llegada.utm, desc: AppState.specialPoints.llegada.desc });
            
            if (sSt) { sSt.className = 'ox-special-state-pill ' + (sOk ? 'ok' : 'bad'); sSt.textContent = sOk ? '✅ completado' : '❌ incompleto'; }
            if (fSt) { fSt.className = 'ox-special-state-pill ' + (fOk ? 'ok' : 'bad'); fSt.textContent = fOk ? '✅ completado' : '❌ incompleto'; }
        }
        
        function drawOriMapMarkers() {
            if (!oxMap) return;
            
            // Limpiar marcadores anteriores
            Object.values(oxMarkers).forEach(m => { try { oxMap.removeLayer(m); } catch(e) {} });
            Object.values(oxSpecialMarkers).forEach(m => { try { oxMap.removeLayer(m); } catch(e) {} });
            oxMarkers = {};
            oxSpecialMarkers = {};
            
            let bounds = [];
            
            // Dibujar puntos especiales
            ['SALIDA', 'LLEGADA'].forEach(id => {
                const p = getPoint(id);
                if (!pointComplete(p)) return;
                
                const ll = utmToLatLon(p.utm);
                if (!ll) return;
                
                const icon = L.divIcon({
                    html: `<svg width="30" height="42"><path d="M15 1 C22 1 28 7 28 14 C28 24 18 28 15 40 C12 28 2 24 2 14 C2 7 8 1 15 1 Z" fill="#d77cf1" stroke="#8a22b5" stroke-width="1.2"/><circle cx="15" cy="14" r="4" fill="#f7f0fb"/></svg>`,
                    className: 'ox-special-marker-wrap',
                    iconSize: [30, 42],
                    iconAnchor: [15, 42]
                });
                
                const mk = L.marker([ll.lat, ll.lon], { icon, draggable: true }).addTo(oxMap);
                mk.bindTooltip(id, { permanent: true, direction: 'top', offset: [0, -14] });
                
                mk.on('dragend', () => {
                    const latlng = mk.getLatLng();
                    const newUtm = latLonToUTM(latlng.lat, latlng.lng);
                    if (newUtm) {
                        saveSpecialPoint(id, newUtm, getPoint(id).desc);
                        refreshSpecialPointsUI();
                        renderPoolPointsList();
                        updatePointSelectOptions();
                    }
                });
                
                oxSpecialMarkers[id] = mk;
                bounds.push([ll.lat, ll.lon]);
            });
            
            // Dibujar balizas normales
            AppState.orientacion.poolPoints.forEach(p => {
                if (!pointComplete(p)) return;
                const ll = utmToLatLon(p.utm);
                if (!ll) return;
                
                const mk = L.marker([ll.lat, ll.lon], { draggable: true }).addTo(oxMap);
                mk.bindTooltip(p.id, { permanent: true, direction: 'top', offset: [0, -14] });
                
                mk.on('dragend', () => {
                    const latlng = mk.getLatLng();
                    const newUtm = latLonToUTM(latlng.lat, latlng.lng);
                    if (newUtm) {
                        savePoolPointField(p.id, 'utm', newUtm);
                        renderPoolPointsList();
                        updatePointSelectOptions();
                    }
                });
                
                oxMarkers[p.id] = mk;
                bounds.push([ll.lat, ll.lon]);
            });
            
            if (bounds.length) oxMap.fitBounds(bounds, { padding: [10, 10], maxZoom: 15 });
        }
        
        function initOriMapIfNeeded() {
            const mapEl = $('oxMap');
            if (!mapEl || oxMap) return;
            
            oxMap = L.map('oxMap').setView([40.4168, -3.7038], 10);
            
            oxLayers = {
                topo: L.tileLayer('https://www.ign.es/wmts/mapa-raster?request=GetTile&service=WMTS&version=1.0.0&layer=MTN&style=default&format=image/jpeg&tilematrixset=GoogleMapsCompatible&tilematrix={z}&tilerow={y}&tilecol={x}', { attribution: '&copy; IGN', maxZoom: 20, minZoom: 4 }),
                aerea: L.tileLayer('https://www.ign.es/wmts/pnoa-ma?request=GetTile&service=WMTS&version=1.0.0&layer=OI.OrthoimageCoverage&style=default&format=image/jpeg&tilematrixset=GoogleMapsCompatible&tilematrix={z}&tilerow={y}&tilecol={x}', { attribution: '&copy; IGN', maxZoom: 20, minZoom: 4 }),
                mapant: L.tileLayer.wms('https://mapant.es/wms', { layers: 'mapant', format: 'image/png', transparent: false, version: '1.3.0', attribution: '&copy; Mapant' })
            };
            
            oxLayers.mapant.addTo(oxMap);
            
            oxMap.on('click', e => {
                const sel = $('oxPointSelect');
                if (!sel || !sel.value) return;
                
                const utm = latLonToUTM(e.latlng.lat, e.latlng.lng);
                if (!utm) return;
                
                const targetId = sel.value;
                if (targetId === 'SALIDA' || targetId === 'LLEGADA') {
                    saveSpecialPoint(targetId, utm, getPoint(targetId).desc);
                    refreshSpecialPointsUI();
                    renderPoolPointsList();
                    updatePointSelectOptions();
                } else {
                    savePoolPointField(targetId, 'utm', utm);
                    renderPoolPointsList();
                    updatePointSelectOptions();
                }
                
                $('oxCursorCoordBanner').textContent = `Coordenadas: ${utm}`;
                $('oxMapInfo').innerHTML = `<strong>${targetId}</strong> asignado · ${utm}`;
                drawOriMapMarkers();
            });
            
            setTimeout(() => oxMap.invalidateSize(), 100);
            drawOriMapMarkers();
        }
        
        function savePoolPointField(id, field, value) {
            const p = AppState.orientacion.poolPoints.find(x => x.id === id);
            if (!p) return;
            p[field] = value;
            saveState();
        }
        
        function saveSpecialPoint(id, utm, desc) {
            if (id === 'SALIDA') {
                AppState.specialPoints.salida.utm = utm;
                AppState.specialPoints.salida.desc = desc;
            } else if (id === 'LLEGADA') {
                AppState.specialPoints.llegada.utm = utm;
                AppState.specialPoints.llegada.desc = desc;
            }
            saveState();
        }
        
        function validateAllPoints() {
            const errors = [];
            
            // Validar salida
            if (!pointComplete({ utm: AppState.specialPoints.salida.utm, desc: AppState.specialPoints.salida.desc })) {
                errors.push('SALIDA: falta descripción o coordenada UTM válida.');
            }
            
            // Validar llegada
            if (!pointComplete({ utm: AppState.specialPoints.llegada.utm, desc: AppState.specialPoints.llegada.desc })) {
                errors.push('LLEGADA: falta descripción o coordenada UTM válida.');
            }
            
            // Validar balizas
            AppState.orientacion.poolPoints.forEach(p => {
                if (!p.utm || !p.utm.trim()) errors.push(`${p.id}: falta la coordenada UTM.`);
                else if (!esUTMValido(p.utm)) errors.push(`${p.id}: la UTM no tiene un formato válido.`);
                if (!p.desc || !p.desc.trim()) errors.push(`${p.id}: falta la descripción.`);
            });
            
            return errors;
        }
        
        function showPointErrors(errors) {
            const box = $('oxPointErrors');
            const list = $('oxPointErrorsList');
            if (!box || !list) return;
            
            if (!errors.length) {
                box.style.display = 'none';
                list.innerHTML = '';
                return;
            }
            
            box.style.display = 'block';
            list.innerHTML = errors.map(e => `<div>• ${e}</div>`).join('');
        }

        // ===== FUNCIONES AUXILIARES DE ORIENTACIÓN =====
        function syncOriParticipants() {
            const names = [];
            document.querySelectorAll('#oxParticipantList .ox-participant-name').forEach(inp => {
                const name = inp.value.trim();
                if (name) names.push(name);
            });
            
            if (names.length) {
                const old = AppState.orientacion.participants;
                AppState.orientacion.participants = names.map((name, i) => ({
                    name,
                    qrId: (old[i] && old[i].qrId) || `ORI-${String(i + 1).padStart(3, '0')}`,
                    status: (old[i] && old[i].status) || 'pendiente',
                    startTs: (old[i] && old[i].startTs) || null,
                    finishTs: (old[i] && old[i].finishTs) || null,
                    lastBaliza: (old[i] && old[i].lastBaliza) || '',
                    scans: (old[i] && old[i].scans) || [],
                    completedCount: (old[i] && old[i].completedCount) || 0,
                    incidents: (old[i] && old[i].incidents) || 0
                }));
            }
            saveState();
        }
        
        function renderOriQueue() {
            const box = $('oxQueueBoard');
            if (!box) return;
            box.innerHTML = AppState.orientacion.participants.map((p, i) => `
                <div class="ox-pcard">
                    <div class="ox-phead">
                        <div style="font-family:monospace;font-weight:900;color:var(--accent)">${p.name}</div>
                        <span class="ox-status ${p.status}">${p.status}</span>
                    </div>
                    <div class="ox-meta">
                        <div><strong>QR:</strong> ${p.qrId}</div>
                        <div><strong>Orden:</strong> ${i + 1}</div>
                    </div>
                </div>
            `).join('');
        }
        
        function showCurrentQR() {
            const idx = AppState.orientacion.startQueueIndex;
            const canvas = $('oxStartCanvas');
            const ph = $('oxStartPlaceholder');
            const lab = $('oxStartLabel');
            const status = $('oxStartStatus');
            
            if (idx >= AppState.orientacion.participants.length) {
                canvas.style.display = 'none';
                ph.style.display = '';
                ph.textContent = 'Todos los participantes han escaneado su QR de salida.';
                lab.textContent = '';
                status.innerHTML = '<strong>Salida completada.</strong>';
                return;
            }
            
            const p = AppState.orientacion.participants[idx];
            drawQR(JSON.stringify({ qrId: p.qrId, name: p.name, exercise: AppState.orientacion.exerciseName || '' }));
            ph.style.display = 'none';
            lab.textContent = `${p.name} · ${p.qrId}`;
            status.innerHTML = `<strong>Participante actual:</strong> ${p.name} · ${idx + 1} de ${AppState.orientacion.participants.length}`;
        }
        
        function drawQR(text) {
            const canvas = $('oxStartCanvas');
            const ctx = canvas.getContext('2d');
            const size = 220;
            canvas.width = size;
            canvas.height = size;
            
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, size, size);
            ctx.fillStyle = '#111';
            
            let seed = 0;
            for (let i = 0; i < text.length; i++) seed = (seed * 31 + text.charCodeAt(i)) >>> 0;
            
            const cell = 10;
            for (let y = 0; y < 22; y++) {
                for (let x = 0; x < 22; x++) {
                    seed = (1664525 * seed + 1013904223) >>> 0;
                    if ((seed & 3) !== 0) ctx.fillRect(x * cell, y * cell, cell - 1, cell - 1);
                }
            }
            
            canvas.style.display = '';
        }
        
        function renderOriBoard() {
            const box = $('oxBoard');
            if (!box) return;
            
            const pend = AppState.orientacion.participants.filter(p => p.status === 'pendiente').length;
            const car = AppState.orientacion.participants.filter(p => p.status === 'carrera').length;
            const fin = AppState.orientacion.participants.filter(p => p.status === 'finalizado').length;
            
            if ($('oxPend')) $('oxPend').textContent = pend;
            if ($('oxCarrera')) $('oxCarrera').textContent = car;
            if ($('oxFin')) $('oxFin').textContent = fin;
            if ($('oxSummary')) $('oxSummary').innerHTML = `<strong>Ejercicio:</strong> ${AppState.orientacion.exerciseName || '--'} · <strong>Participantes:</strong> ${AppState.orientacion.participants.length}`;
            
            // Selectores de paso 6
            const ps = $('oxEvtParticipant');
            const bs = $('oxEvtBaliza');
            if (ps) {
                ps.innerHTML = AppState.orientacion.participants.map((p, i) => `<option value="${i}">${p.name}</option>`).join('');
            }
            if (bs) {
                bs.innerHTML = getPoolRoute().map(id => `<option value="${id}">${id}</option>`).join('');
            }
            
            box.innerHTML = AppState.orientacion.participants.map(p => {
                const stClass = p.status === 'carrera' ? 'carrera' : (p.status === 'finalizado' ? 'finalizado' : 'pendiente');
                return `
                    <div class="ox-pcard">
                        <div class="ox-phead">
                            <div style="font-family:monospace;font-weight:900;color:var(--accent)">${p.name}</div>
                            <span class="ox-status ${stClass}">${p.status}</span>
                        </div>
                        <div class="ox-meta">
                            <div><strong>QR:</strong> ${p.qrId}</div>
                            <div><strong>Salida:</strong> ${p.startTs ? new Date(p.startTs).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '--'}</div>
                            <div><strong>Última:</strong> ${p.lastBaliza || '--'}</div>
                            <div><strong>Hechas:</strong> ${p.completedCount || 0}</div>
                        </div>
                    </div>`;
            }).join('');
        }
        
        function renderOriLog() {
            const box = $('oxLog');
            if (!box) return;
            
            box.innerHTML = AppState.orientacion.scanLog.length
                ? [...AppState.orientacion.scanLog].slice(-12).reverse().map(e => {
                    if (e.type === 'salida') return `<div class="ox-logitem">🚩 <strong>${e.participant}</strong> salió a las ${e.time}</div>`;
                    if (e.type === 'baliza') return `<div class="ox-logitem">📍 <strong>${e.participant}</strong> validó ${e.baliza} a las ${e.time}</div>`;
                    if (e.type === 'final') return `<div class="ox-logitem">🏁 <strong>${e.participant}</strong> finalizó a las ${e.time}</div>`;
                    return '';
                }).join('')
                : '<div class="small">Sin eventos registrados.</div>';
        }
        
        function registerBaliza() {
            const idx = parseInt($('oxEvtParticipant').value);
            const baliza = $('oxEvtBaliza').value;
            const p = AppState.orientacion.participants[idx];
            if (!p || !baliza) return;
            
            if (!p.startTs) p.startTs = Date.now();
            if (p.status === 'pendiente') p.status = 'carrera';
            
            p.scans = Array.isArray(p.scans) ? p.scans : [];
            p.scans.push({ baliza, ts: Date.now() });
            p.lastBaliza = baliza;
            p.completedCount = p.scans.length;
            
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            AppState.orientacion.scanLog.push({ type: 'baliza', participant: p.name, baliza, time });
            
            if (p.completedCount >= AppState.orientacion.balizasPorRecorrido + 2) {
                p.status = 'finalizado';
                p.finishTs = Date.now();
                AppState.orientacion.scanLog.push({ type: 'final', participant: p.name, time });
            }
            
            saveState();
            renderOriBoard();
            renderOriLog();
            $('oxLastEvent').innerHTML = `<strong>Último evento:</strong> ${p.name} validó ${baliza} a las ${time}`;
        }
        
        function finalizeParticipant() {
            const idx = parseInt($('oxEvtParticipant').value);
            const p = AppState.orientacion.participants[idx];
            if (!p) return;
            
            p.status = 'finalizado';
            if (!p.finishTs) p.finishTs = Date.now();
            const time = new Date(p.finishTs).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            AppState.orientacion.scanLog.push({ type: 'final', participant: p.name, time });
            
            saveState();
            renderOriBoard();
            renderOriLog();
        }
        
        function resetAll() {
            AppState.orientacion.participants.forEach(p => {
                p.status = 'pendiente';
                p.startTs = null;
                p.finishTs = null;
                p.lastBaliza = '';
                p.scans = [];
                p.completedCount = 0;
                p.incidents = 0;
            });
            AppState.orientacion.scanLog = [];
            AppState.orientacion.startQueueIndex = 0;
            saveState();
            renderOriQueue();
            renderOriBoard();
            renderOriLog();
            $('oxLastEvent').innerHTML = 'Sin eventos todavía.';
        }
        
        function exportCSV() {
            const rows = [['Participante', 'QR', 'Estado', 'Salida', 'Tiempo', 'Balizas completadas']];
            AppState.orientacion.participants.forEach(p => {
                const tiempo = p.startTs 
                    ? new Date((p.finishTs || Date.now()) - p.startTs).toISOString().substr(11, 8)
                    : '--';
                rows.push([
                    p.name,
                    p.qrId,
                    p.status,
                    p.startTs ? new Date(p.startTs).toLocaleTimeString() : '--',
                    tiempo,
                    p.completedCount || 0
                ]);
            });
            
            const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `RESULTADOS_${(AppState.orientacion.exerciseName || 'ORIENTACION').replace(/[^a-zA-Z0-9_-]+/g, '_')}.csv`;
            a.click();
            URL.revokeObjectURL(a.href);
        }
        
        async function searchPlace() {
            const q = ($('oxPlaceSearch').value || '').trim();
            if (!q) return;
            
            try {
                const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q=${encodeURIComponent(q)}`;
                const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
                const data = await res.json();
                
                if (Array.isArray(data) && data.length && oxMap) {
                    const lat = parseFloat(data[0].lat);
                    const lon = parseFloat(data[0].lon);
                    oxMap.setView([lat, lon], 15);
                    toast('📍 Lugar encontrado', 'success');
                } else {
                    toast('No se encontró el lugar', 'error');
                }
            } catch(e) {
                toast('Error en la búsqueda', 'error');
            }
        }
        
        function locateUser() {
            if (!navigator.geolocation || !oxMap) return;
            
            navigator.geolocation.getCurrentPosition(
                pos => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    if (oxUserMarker) oxMap.removeLayer(oxUserMarker);
                    oxUserMarker = L.circleMarker([lat, lng], {
                        radius: 8, color: '#1f6fff', weight: 3,
                        fillColor: '#7cc0ff', fillOpacity: 0.95
                    }).addTo(oxMap).bindPopup(`<strong>Tu ubicación</strong><br>${latLonToUTM(lat, lng)}`);
                    oxMap.setView([lat, lng], Math.max(oxMap.getZoom(), 15));
                    toast('📍 Ubicación encontrada', 'success');
                },
                () => toast('No se pudo obtener la ubicación', 'error'),
                { enableHighAccuracy: true, timeout: 15000 }
            );
        }
        
        async function importFromExcel(file) {
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    let rows = [];
                    const name = (file.name || '').toLowerCase();
                    
                    if (name.endsWith('.csv')) {
                        const txt = String(evt.target.result || '');
                        const lines = txt.split(/\r?\n/).filter(Boolean);
                        const headers = (lines.shift() || '').split(',').map(h => h.trim().toLowerCase());
                        rows = lines.map(line => {
                            const cells = line.split(',');
                            const obj = {};
                            headers.forEach((h, i) => obj[h] = (cells[i] || '').trim());
                            return obj;
                        });
                    } else {
                        const wb = XLSX.read(evt.target.result, { type: 'array' });
                        const ws = wb.Sheets[wb.SheetNames[0]];
                        rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
                    }
                    
                    let changed = 0;
                    rows.forEach(row => {
                        const id = (row.id || row.ID || row.punto || row.PUNTO || row.baliza || row.BALIZA || '').toString().trim().toUpperCase();
                        const utm = (row.utm || row.UTM || row.coordenada || row.COORDENADA || '').toString().trim();
                        const desc = (row.descripcion || row.DESCRIPCION || row.desc || row.DESC || row.nombre || row.NOMBRE || '').toString().trim();
                        
                        if (id === 'SALIDA' || id === 'LLEGADA') {
                            saveSpecialPoint(id, utm, desc);
                            changed++;
                        } else {
                            const p = AppState.orientacion.poolPoints.find(x => x.id === id);
                            if (p) {
                                if (utm) p.utm = utm;
                                if (desc) p.desc = desc;
                                changed++;
                            }
                        }
                    });
                    
                    saveState();
                    fillOriInputs();
                    drawOriMapMarkers();
                    toast(`✅ Importados ${changed} puntos desde Excel`, 'success');
                } catch(err) {
                    toast('Error al importar Excel', 'error');
                }
            };
            
            if ((file.name || '').toLowerCase().endsWith('.csv')) reader.readAsText(file);
            else reader.readAsArrayBuffer(file);
        }
        
        function importFromGpx(file) {
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const xml = new DOMParser().parseFromString(String(evt.target.result || ''), 'application/xml');
                    const wpts = Array.from(xml.getElementsByTagName('wpt'));
                    let changed = 0;
                    
                    wpts.forEach(wpt => {
                        const lat = parseFloat(wpt.getAttribute('lat'));
                        const lon = parseFloat(wpt.getAttribute('lon'));
                        if (!isFinite(lat) || !isFinite(lon)) return;
                        
                        const utm = latLonToUTM(lat, lon);
                        const rawName = (wpt.getElementsByTagName('name')[0]?.textContent || '').trim();
                        const spaceIdx = rawName.indexOf(' ');
                        const rawId = spaceIdx >= 0 ? rawName.slice(0, spaceIdx).toUpperCase() : rawName.toUpperCase();
                        const desc = spaceIdx >= 0 ? rawName.slice(spaceIdx + 1).trim() : '';
                        
                        if (rawId === 'SALIDA' || rawId === 'LLEGADA') {
                            saveSpecialPoint(rawId, utm, desc);
                            changed++;
                        } else {
                            const p = AppState.orientacion.poolPoints.find(x => x.id === rawId);
                            if (p) {
                                p.utm = utm;
                                if (desc) p.desc = desc;
                                changed++;
                            }
                        }
                    });
                    
                    saveState();
                    fillOriInputs();
                    drawOriMapMarkers();
                    toast(`✅ Importados ${changed} puntos desde GPX`, 'success');
                } catch(err) {
                    toast('Error al importar GPX', 'error');
                }
            };
            reader.readAsText(file);
        }
        
        // ===== CAMBIO DE MODO =====
        function showTopograficaMode() {
            $('orientacionShell').style.display = 'none';
            document.querySelector('.steps-container').style.display = '';
            ['step1', 'step2', 'step3'].forEach(id => $(id).style.display = '');
            AppState.appMode = 'topografica';
            saveState();
            updateHeaderTabs();
        }
        
        function showOrientacionMode() {
            document.querySelector('.steps-container').style.display = 'none';
            ['step1', 'step2', 'step3'].forEach(id => $(id).style.display = 'none');
            $('orientacionShell').style.display = '';
            AppState.appMode = 'orientacion';
            saveState();
            renderOriRoot();
            updateHeaderTabs();
        }
        
        function updateHeaderTabs() {
            const topo = $('headerTopoTab');
            const ori = $('headerOriTab');
            if (topo && ori) {
                const activeGradient = 'linear-gradient(180deg, #8db06a, #718b56)';
                const inactiveGradient = 'linear-gradient(180deg, #667b57, #536347)';
                topo.style.background = AppState.appMode === 'topografica' ? activeGradient : inactiveGradient;
                ori.style.background = AppState.appMode === 'orientacion' ? activeGradient : inactiveGradient;
            }
        }
        
        // ===== INICIALIZACIÓN =====
        function init() {
            loadState();
            
            // Configurar tema
            if (AppState.theme === 'dark') document.body.classList.add('dark');
            
            // Configurar selectores paso 1
            $('numModulosSelect').value = AppState.modulos;
            $('puntosPorModuloSelect').value = AppState.puntosPorModulo;
            $('coordTypeConfig').value = AppState.coordType;
            
            // Modo inicial
            if (AppState.appMode === 'orientacion') {
                showOrientacionMode();
            } else {
                showTopograficaMode();
            }
            
            // Event listeners del header
            $('headerTopoTab').addEventListener('click', () => {
                if (AppState.appMode !== 'topografica') showTopograficaMode();
            });
            $('headerOriTab').addEventListener('click', () => {
                if (AppState.appMode !== 'orientacion') showOrientacionMode();
            });
            
            // Tema
            $('themeSwitch').addEventListener('click', e => {
                const t = e.target.closest('.theme-opt')?.getAttribute('data-theme');
                if (t) {
                    AppState.theme = t;
                    localStorage.setItem(THEME_KEY, t);
                    if (t === 'dark') document.body.classList.add('dark');
                    else document.body.classList.remove('dark');
                    document.querySelectorAll('.theme-opt').forEach(o => o.classList.remove('active'));
                    e.target.closest('.theme-opt').classList.add('active');
                }
            });
        }
        
        // Arrancar cuando el DOM esté listo
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
        
    })();
    </script>
